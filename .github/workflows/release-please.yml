name: release-please

# Opens and maintains a release PR, and cuts a GitHub release when it merges.
# v0.0.0 marks the fork point, so versioning starts from this repo's own work and
# the upstream history inherited through the fork is not counted.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json