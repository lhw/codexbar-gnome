name: ci

# Builds the extension, runs the headless test suites, and uploads the packaged
# zip as a downloadable artifact.
#
# ui-test.sh is not run here: it needs a headless GNOME Shell with a working
# GPU, which GitHub's runners do not reliably provide. Run it locally.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gjs \
            gnome-shell \
            libglib2.0-bin

      - name: Report versions
        run: |
          gjs --version
          gnome-shell --version
          glib-compile-schemas --version

      # test-cli.js shells out to the real codexbar binary and skips itself when
      # it is absent, which is expected here.
      - name: Build and test
        run: ./build.sh

      - name: List packaged artifact
        run: ls -la ./*.shell-extension.zip

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-gnome-extension
          path: ./*.shell-extension.zip
          if-no-files-found: error
          retention-days: 30