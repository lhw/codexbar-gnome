name: release

# Builds the extension zip and attaches it to the published release.
#
# Triggered on workflow_run rather than on `release: published`, because
# release-please publishes with GITHUB_TOKEN and events from that token do not
# trigger further workflow runs.
#
# workflow_run fires after every release-please run, including ones that only
# opened a release PR, so the first step checks whether a release was actually
# cut and skips the expensive gnome-shell install when it was not.
on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only act when release-please itself succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check whether a release was actually cut
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            TAG="$(gh release view "$REQUESTED_TAG" --json tagName --jq .tagName)"
          else
            TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          if [ -n "$REQUESTED_TAG" ] || [ "$TAG_SHA" = "$HEAD_SHA" ]; then
            echo "Release $TAG at $TAG_SHA, building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "No new release (latest is $TAG at $TAG_SHA), skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.gate.outputs.build == 'true'
        with:
          ref: ${{ steps.gate.outputs.sha }}

      - name: Install build dependencies
        if: steps.gate.outputs.build == 'true'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Install GNOME build dependencies
        if: steps.gate.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gjs \
            gnome-shell \
            libglib2.0-bin

      - name: Build
        if: steps.gate.outputs.build == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          # The immutable v1.2.0 tests require this directory; newer tests use tempfile defaults.
          if [ "$TAG" = "v1.2.0" ]; then mkdir -p /tmp/opencode; fi
          ./build.sh

      - name: Attach extension zip to the release
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          echo "Attaching to $TAG"
          gh release upload "$TAG" ./*.shell-extension.zip --clobber
