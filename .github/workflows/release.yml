name: release

# Attaches the packaged zip to a published GitHub release, so the release page
# is where users download from.
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  attach-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gjs \
            gnome-shell \
            libglib2.0-bin

      - name: Build
        run: ./build.sh

      - name: Attach extension zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./*.shell-extension.zip --clobber