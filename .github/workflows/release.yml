name: release

# Builds the extension zip and attaches it to the published release.
#
# Triggered on workflow_run rather than on `release: published`, because
# release-please publishes with GITHUB_TOKEN and events from that token do not
# trigger further workflow runs. Waiting for release-please to finish sidesteps
# that, and checking the conclusion guards against a failed release run.
on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]

permissions:
  contents: write

jobs:
  attach-artifact:
    runs-on: ubuntu-latest
    # Only act when release-please itself succeeded.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gjs \
            gnome-shell \
            libglib2.0-bin

      - name: Build
        run: ./build.sh

      - name: Attach extension zip to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(gh release view --json tagName --jq .tagName)"
          echo "Attaching to $TAG"
          gh release upload "$TAG" ./*.shell-extension.zip --clobber